name: 每日情侣图片 Prompts

on:
  schedule:
    # GitHub cron 使用 UTC；01:00 UTC = 北京/台北时间 09:00。
    - cron: "0 1 * * *"
  workflow_dispatch:
    inputs:
      date:
        description: "可选生成日期（YYYY-MM-DD），留空使用北京时间当天"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: daily-couple-prompts
  cancel-in-progress: false

jobs:
  generate-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      DEEPSEEK_MODEL: ${{ vars.DEEPSEEK_MODEL }}
      CONTENT_TIMEZONE: Asia/Shanghai
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Generate prompts
        shell: bash
        run: |
          if [ -n "${{ inputs.date }}" ]; then
            python generate_daily.py --date "${{ inputs.date }}"
          else
            python generate_daily.py
          fi

      - name: Commit cloud output
        shell: bash
        run: |
          git add episodes/
          if git diff --cached --quiet; then
            echo "No new episode to commit."
            exit 0
          fi
          git config user.name "smallyellow-bot"
          git config user.email "smallyellow-bot@users.noreply.github.com"
          git commit -m "content: generate daily image prompts"
          git push origin HEAD:main
